name: Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag || { echo 'Run this workflow on a vX.Y.Z tag.'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-android-release.py "$RELEASE_TAG"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify bundled Earth imagery
        run: python3 scripts/fetch-earth-assets.py
      - name: Build, test and lint release
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Sign and verify APK
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/sign-android-release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: dist
      - name: Verify download and publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          # Never replace an existing public version with different bytes.
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Publish a new version instead."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Native Android preview for PaxWorkspace. Android 8.0 (API 26) or newer.

          Download the APK below. SHA256SUMS and signing-certificate.txt allow artifact verification.
          This is a preview client; iOS/macOS releases are not included.

          Release APKs use a dedicated, stable signing key. An existing locally signed debug
          installation cannot be updated in place with this APK. Keep it installed if you need
          its local session data; uninstalling it removes that data and requires signing in again.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "PaxWorkspace Android $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ./*.apk SHA256SUMS signing-certificate.txt
