name: Verify native clients

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build shared Apple package
        run: swift build --package-path apple/Packages/PaxWorkspaceKit
      - name: Build iOS simulator app
        run: >-
          xcodebuild -project apple/PaxWorkspace.xcodeproj
          -scheme PaxWorkspace -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/pax-ios" CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
